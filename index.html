<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello World</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #f4f4f5;
    }
    main {
      background: white;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    input, button {
      font-size: 16px;
      padding: 10px 14px;
      border-radius: 8px;
    }
    input { border: 1px solid #ccc; }
    button {
      border: none;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }
    #output { font-size: 28px; margin-top: 24px; min-height: 36px; }
  </style>
</head>
<body>
  <main>
    <form id="form">
      <input id="name" type="text" placeholder="Your name" autofocus>
      <button type="submit">Say hello</button>
    </form>
    <p id="output"></p>
  </main>

  <script>
    document.getElementById("form").addEventListener("submit", function (event) {
      event.preventDefault();
      const name = document.getElementById("name").value.trim();
      document.getElementById("output").textContent = name ? "Hello " + name : "Please enter a name";
    });
  </script>
</body>
</html>
